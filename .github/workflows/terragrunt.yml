name: 'Terragrunt_dev GitHub Actions'
on:
  - pull_request
env:
  tf_version: 'latest'  # Consider specifying a specific version
  tg_version: 'latest'
  tf_working_dir: './environments/dev'
jobs:
  terragrunt:
    name: 'Terragrunt_dev'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v2  # Use a specific version
      - name: 'Clear Terraform Cache'
        run: rm -rf .terraform
      - name: 'Terragrunt Init'
        uses: the-commons-project/terragrunt-github-actions@v1.0.0  # Use a specific version
        with:
          tf_actions_version: ${{ env.tf_version }}
          tg_actions_version: ${{ env.tg_version }}
          tf_actions_subcommand: 'init'
          tf_actions_working_dir: ${{ env.tf_working_dir }}
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Terragrunt Validate'
        uses: the-commons-project/terragrunt-github-actions@v1.0.0  # Use a specific version
        with:
          tf_actions_version: ${{ env.tf_version }}
          tg_actions_version: ${{ env.tg_version }}
          tf_actions_subcommand: 'validate'
          tf_actions_working_dir: ${{ env.tf_working_dir }}
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}