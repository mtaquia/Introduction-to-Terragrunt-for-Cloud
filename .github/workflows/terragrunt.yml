name: 'Terragrunt_dev GitHub Actions'
permissions:
    id-token: write # allow GitHub's OIDC provider to create a JSON Web Token for every run.
    # You won't be able to request the OIDC JWT ID token if the permissions for id-token is not set to write
    contents: read # This is required for actions/checkout
on:
  - pull_request
env:
  tf_version: 'latest' # 1.11.4
  tg_version: 'latest' # 0.78.2
  tf_working_dir: './environments/dev'
jobs:
  terragrunt:
    name: 'Terragrunt_dev'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@master
      - name: assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-skip-session-tagging: true
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::719798204634:role/GitHub-role-test
      - run: aws sts get-caller-identity
      - name: 'Terragrunt Format'
        uses: the-commons-project/terragrunt-github-actions@master
        with:
          tf_actions_version: ${{ env.tf_version }}
          tg_actions_version: ${{ env.tg_version }}
          tf_actions_binary: 'terraform'
          tf_actions_subcommand: 'fmt'
          tf_actions_working_dir: ${{ env.tf_working_dir }}
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Terragrunt Init'
        uses: the-commons-project/terragrunt-github-actions@master
        with:
          tf_actions_version: ${{ env.tf_version }}
          tg_actions_version: ${{ env.tg_version }}
          tf_actions_subcommand: 'init'
          tf_actions_working_dir: ${{ env.tf_working_dir }}
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   - name: 'Terragrunt Validate'
    #     uses: the-commons-project/terragrunt-github-actions@master
    #     with:
    #       tf_actions_version: ${{ env.tf_version }}
    #       tg_actions_version: ${{ env.tg_version }}
    #       tf_actions_binary: 'terraform'
    #       tf_actions_subcommand: 'validate'
    #       tf_actions_working_dir: ${{ env.tf_working_dir }}
    #       tf_actions_comment: true
    #     env:
    #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Terragrunt Plan'
        uses: the-commons-project/terragrunt-github-actions@master
        with:
          tf_actions_version: ${{ env.tf_version }}
          tg_actions_version: ${{ env.tg_version }}
          tf_actions_subcommand: 'plan'
          tf_actions_working_dir: ${{ env.tf_working_dir }}
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}